# Optional Netlify frontend hosting configuration.
# Publish the existing public/ folder.
[build]
  publish = "public"

# After the actual Cloudflare Worker URL is confirmed, replace the placeholder.
# Do not enable this redirect until the Worker is deployed and tested.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE_WITH_EXISTING_WORKER_HOST/api/:splat"
  status = 200
  force = true
